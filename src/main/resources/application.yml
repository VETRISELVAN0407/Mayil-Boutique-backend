spring:
  application:
    name: mayil-boutique-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mayil_boutique}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Transport-level cap; the exact per-image limit is app.images.max-size-bytes.
      max-file-size: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}
      max-request-size: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE:6MB}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:mayilboutique-dev-only-secret-change-me-0123456789abcdef}
  access-token-validity-ms: 900000
  refresh-token-validity-ms: 2592000000

app:
  images:
    # Folder OUTSIDE the project that holds product image files (the DB stores only filenames).
    # Back this folder up together with the database.
    dir: ${PRODUCT_IMAGE_DIR:${user.home}/mayil-boutique/product-images}
    max-size-bytes: ${PRODUCT_IMAGE_MAX_BYTES:5242880}
  tryon:
    # Virtual Try-On stays off (job creation answers 503) until an AI provider is connected.
    enabled: ${TRYON_ENABLED:false}
    # none | selfhosted (tryon-service/) | fashn (hosted fashn.ai; TRYON_SERVICE_API_KEY = your FASHN key, TRYON_SERVICE_URL blank)
    provider: ${TRYON_PROVIDER:none}
    service-url: ${TRYON_SERVICE_URL:}
    service-api-key: ${TRYON_SERVICE_API_KEY:}
    # PRIVATE folder for customer photos / results, outside the project and NOT served. Files live ~30 minutes; no backup needed.
    dir: ${TRYON_TMP_DIR:${user.home}/mayil-boutique/tryon-tmp}
    max-photo-bytes: ${TRYON_MAX_PHOTO_BYTES:5242880}
    retention-minutes: ${TRYON_RETENTION_MINUTES:30}
    active-job-minutes: ${TRYON_ACTIVE_JOB_MINUTES:30}
    max-jobs-per-hour: ${TRYON_MAX_JOBS_PER_HOUR:5}
    max-jobs-per-day: ${TRYON_MAX_JOBS_PER_DAY:20}
    # Optional: cost of one successful preview (e.g. GPU cost, INR); only feeds the estimate on the admin Virtual Try-On page.
    cost-per-successful-job: ${TRYON_COST_PER_JOB:0}
  admin:
    mobile: ${ADMIN_MOBILE:9999999999}
    password: ${ADMIN_PASSWORD:Admin@12345}
  sms:
    # none (default: OTP requests fail with 503) | msg91 | log (local dev only, prints the OTP to the console) | dummy (TEMPORARY test mode: OTP shown on the login page; refused with the prod profile)
    provider: ${SMS_PROVIDER:none}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      country-code: ${MSG91_COUNTRY_CODE:91}
